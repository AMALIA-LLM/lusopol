{% extends "base.html" %}
{% block title %}Sign in — Preference labeling{% endblock %}
{% block main_class %}wrap centered{% endblock %}

{% block content %}
<div class="card login-card">
  <h1>⚖️ Preference labeling</h1>
  <p class="muted">Sign in with the credentials you were given.</p>
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="username">Username</label>
    <input id="username" name="username" autocomplete="username" autocapitalize="none"
           autofocus required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="primary block" type="submit">Sign in</button>
  </form>
</div>
{% endblock %}
